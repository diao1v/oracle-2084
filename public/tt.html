<!doctype html>
<html><head><meta charset="utf-8"><title>turnstile test</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
  function ok(t){ document.getElementById('out').textContent = 'TOKEN OK: ' + t.slice(0,12) + '…'; }
  function bad(c){ document.getElementById('out').textContent = 'ERROR ' + c; return true; }
</script></head>
<body style="font-family:monospace;padding:24px">
<p>Stock Turnstile widget, no app code.</p>
<div class="cf-turnstile" data-sitekey="0x4AAAAAAFIvAMC-BOST5cSK" data-callback="ok" data-error-callback="bad"></div>
<p id="out">waiting…</p>
</body></html>
